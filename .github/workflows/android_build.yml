name: KhataBook Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --project-name=khatabook \
              --org=com.khatabook \
              --no-pub \
              .
          else
            echo "Android project already exists. Skipping flutter create."
          fi
          # flutter create can generate the default MyApp test. It is not part of this app.
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Format source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhataBook-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
